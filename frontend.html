<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>click Counter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      margin: 0;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    #toastContainer {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      animation: popIn 0.2s ease forwards;
    }
    .toast-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .toast-success { background: #dcfce7; color: #166534; border: 1px solid #4ade80; }
    .toast-info { background: #e0f2fe; color: #075985; border: 1px solid #38bdf8; }
    @keyframes popIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    input, select {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      margin-bottom: 12px;
      outline: none;
      background: #f8fafc;
    }
    input:focus, select:focus { border-color: #f43f5e; background: #fff; }

    .counter-display {
      font-size: clamp(36px, 8vw, 60px);
      font-weight: 900;
      text-align: center;
      margin: 14px 0;
      word-break: break-all;
      line-height: 1.1;
      user-select: none;
      transition: transform 0.05s ease;
    }
    .counter-pop { transform: scale(1.12); color: #f43f5e; }

    .btn-red {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 22px rgba(225,29,72,0.35);
      transition: transform 0.05s ease;
    }
    .btn-red:active { transform: scale(0.96); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #0f172a;
      color: #fff;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      padding: 11px;
      background: #f1f5f9;
      color: #334155;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-text {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      margin-top: 14px;
      text-decoration: underline;
      display: block;
      width: 100%;
    }
    .hidden { display: none !important; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: #fff;
      width: 90%;
      max-width: 340px;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    ol { padding-left: 20px; word-break: break-all; }
    li { margin-bottom: 8px; font-size: 14px; }
  </style>
</head>

      <button class="btn-secondary" onclick="toggleAuth(true)">Already have an account? Login</button>
    </div>

    <button class="btn-secondary" onclick="enterAsGuest()">👤 Play as Guest</button>
  </div>

  <!-- VERIFICATION SECTION -->
  <div id="verifySection" class="hidden">
    <h2 style="margin:0 0 10px;">✉️ Verify Email</h2>
    <p style="color:#64748b; font-size:14px; margin-bottom:16px;">
      Enter the 6-digit verification code sent to your email.
    </p>
    <input type="text" id="codeInput" maxlength="8" placeholder="123456" style="text-align:center; font-size:22px; letter-spacing:6px; font-weight:bold;" />
<button class="btn-primary" id="verifyBtn" onclick="verifyCode()">✅ Verify & Play</button>
    <button class="btn-secondary" id="resendBtn" onclick="resendCode()">🔄 Resend Code</button>
    <button class="btn-secondary" onclick="backToRegister()">Back to Registration</button>
  </div>

  <!-- MAIN APP -->
  <div id="appSection" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div>
        <span id="userFlag" style="font-size:18px;"></span> <b id="currentUser"></b>
      </div>
      <a href="#" onclick="logout()" style="color:#94a3b8; font-size:13px; text-decoration:none; font-weight:600;">Exit</a>
    </div>
    
    <div class="counter-display" id="counter">0</div>
    
    <button class="btn-red" id="clickBtn" onclick="handleClick()">⚡ Click Me</button>
    <button class="btn-text" onclick="openResetModal()">Reset Count</button>

    <hr style="margin: 20px 0 14px; border: 0; border-top: 1px solid #f1f5f9;" />

    <h3 style="margin:0 0 8px;">🏆 Live Leaderboard</h3>
    <ol id="rankingList"></ol>
  </div>
</div>

<!-- WARNING MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle" style="color:#e11d48; margin-top:0;">⚠️ Warning (1/3)</h3>
    <p id="modalDesc" style="color:#64748b; font-size:14px;">Reset your score to zero?</p>
    <div class="modal-actions">
      <button style="background:#f1f5f9; color:#334155;" onclick="closeResetModal()">Cancel</button>
      <button style="background:#e11d48; color:#fff;" id="modalConfirmBtn" onclick="nextWarning()">Continue</button>
    </div>
  </div>
</div>

<!-- BANNED MODAL -->
<div class="modal-overlay" id="banOverlay">
  <div class="modal" style="border: 2px solid #e11d48;">
    <h2 style="color:#e11d48; margin-top:0;">🚨 ACCOUNT BANNED</h2>
    <p style="color:#475569; font-size:14px; line-height:1.5;">
      <b>Auto-clicker software detected.</b><br/>Your account has been permanently excluded from the leaderboard.
    </p>
    <button class="btn-secondary" onclick="logout()">Exit</button>
  </div>
</div>

<script>
  const SERVERS = [
    "https://website-with-database-click-counter.onrender.com",
    "https://website-with-database-click-coun-git-6fb921-r4k1n-rashedujjaman.vercel.app/api/vercelbackend"
  ];

  let activeUser = null;
  let isGuest = false;
  let guestCount = 0n;
  let pendingIdentifier = "";
  let warningStep = 0;

  // Handles Render cold-start (~50 sec delay)
  async function apiCall(path, body = null, method = "POST") {
    let wakingNotice = null;

    for (const server of SERVERS) {
      const controller = new AbortController();
      // 55 seconds timeout for cold-booting servers
      const timer = setTimeout(() => controller.abort(), 55000);

      const slowWakeTimer = setTimeout(() => {
        wakingNotice = notify("Waking up server from idle sleep... please wait ~30s", "info");
      }, 3500);

      try {
        const isGet = method === "GET";
        const isVercel = server.includes('vercelbackend');
        const url = isGet 
          ? (isVercel ? server : `${server}/api/users`)
          : (isVercel ? server : `${server}/api/${path}`);

        const payload = body ? { ...body, action: path } : { action: path };
        const opts = { 
          method: isGet ? "GET" : "POST", 
          headers: { "Content-Type": "application/json" }, 
          signal: controller.signal 
        };
        if (!isGet) opts.body = JSON.stringify(payload);

        const res = await fetch(url, opts);
        clearTimeout(timer);
        clearTimeout(slowWakeTimer);

        const data = await res.json();
        return data;
      } catch (err) {
        clearTimeout(timer);
        clearTimeout(slowWakeTimer);
      }
    }
    return { error: "Network timeout or backend waking up. Please retry in a few seconds." };
  }

  function notify(msg, type = "info") {
    const container = document.getElementById("toastContainer");
    const el = document.createElement("div");
    el.className = `toast toast-${type}`;
    el.innerHTML = `<span>${type === 'error' ? '❌' : type === 'success' ? '🎉' : '✉️'}</span> <span>${msg}</span>`;
    container.appendChild(el);
    setTimeout(() => { 
      el.style.opacity = "0"; 
      setTimeout(() => el.remove(), 250); 
    }, 4500);
    return el;
  }

  function toggleAuth(showLogin) {
    document.getElementById("loginGroup").classList.toggle("hidden", !showLogin);
    document.getElementById("signupGroup").classList.toggle("hidden", showLogin);
    document.getElementById("authTitle").innerText = showLogin ? "🔑 Login" : "✨ Create Account";
  }

  function backToRegister() {
    document.getElementById("verifySection").classList.add("hidden");
    document.getElementById("authSection").classList.remove("hidden");
    toggleAuth(false);
  }

  async function register() {
    const username = document.getElementById("regUsernameInput").value.trim().toLowerCase();
    const email = document.getElementById("regEmailInput").value.trim().toLowerCase();
    const password = document.getElementById("regPassInput").value.trim();
    const flag = document.getElementById("countrySelect").value;

    if (!username || !email || !password) return notify("Fill all fields + password!", "error");

    document.getElementById("regBtn").innerText = "⏳ Sending Code...";
    document.getElementById("regBtn").disabled = true;

    const res = await apiCall("register", { username, email, password, flag });
    
    document.getElementById("regBtn").innerText = "🚀 Sign Up";
    document.getElementById("regBtn").disabled = false;

    if (res.error) return notify(res.error, "error");

    notify("6-digit code sent to your email!", "info");
    pendingIdentifier = email;
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("verifySection").classList.remove("hidden");
  }

  async function verifyCode() {
    const code = document.getElementById("codeInput").value.trim();
    if (!code) return notify("Enter code!", "error");

    document.getElementById("verifyBtn").innerText = "⏳ Verifying...";
    document.getElementById("verifyBtn").disabled = true;

    const res = await apiCall("verify", { identifier: pendingIdentifier, code });
    
    document.getElementById("verifyBtn").innerText = "✅ Verify & Play";
    document.getElementById("verifyBtn").disabled = false;

    if (res.error) return notify(res.error, "error");

    notify("Account verified!", "success");
    activeUser = res.username;
    launchApp(res.username, res.flag || "🏳️", res.score || "0");
  }

  async function login() {
    const identifier = document.getElementById("loginIdInput").value.trim().toLowerCase();
    const password = document.getElementById("loginPassInput").value.trim();

    if (!identifier || !password) return notify("Enter username/email & password!", "error");

    document.getElementById("loginBtn").innerText = "⏳ Logging in...";
    document.getElementById("loginBtn").disabled = true;

    const res = await apiCall("login", { identifier, password });
    
    document.getElementById("loginBtn").innerText = "🔑 Login";
    document.getElementById("loginBtn").disabled = false;

if (res.error) {
      if (res.error.includes("banned")) {
        document.getElementById("banOverlay").classList.add("active");
      } else if (res.error.includes("verify your email")) {
        pendingIdentifier = identifier;
        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("verifySection").classList.remove("hidden");
      }
      return notify(res.error, "error");
    }

    notify("Welcome back!", "success");
    activeUser = res.username;
    launchApp(res.username, res.flag || "🏳️", res.score || "0");
  }

  function enterAsGuest() {
    isGuest = true;
    activeUser = null;
    guestCount = 0n;
    launchApp("Guest", "👤", "0");
  }

  function launchApp(name, flag, score) {
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("verifySection").classList.add("hidden");
    document.getElementById("appSection").classList.remove("hidden");
    document.getElementById("currentUser").innerText = name;
    document.getElementById("userFlag").innerText = flag;
    document.getElementById("counter").innerText = score;
    loadLeaderboard();
  }

let clickQueue = 0n;
let isSending = false;
let leaderboardTimer = null;

function handleClick() {
  const counter = document.getElementById("counter");
  counter.classList.add("counter-pop");
  setTimeout(() => counter.classList.remove("counter-pop"), 50);

  if (isGuest) {
    guestCount += 1n;
    counter.innerText = guestCount.toString();
    return;
  }

  // 1. Instant 0ms visual update
  counter.innerText = (BigInt(counter.innerText || "0") + 1n).toString();
  clickQueue += 1n;

  // 2. Dispatch sequential queue
  processClickQueue();
}

async function processClickQueue() {
  // Lock: never send overlapping requests to prevent database overwrites
  if (isSending || clickQueue <= 0n) return;

  isSending = true;

  // Safe chunking: max 20 per request so anti-cheat never triggers
  const countToSend = clickQueue > 20n ? 20n : clickQueue;
  clickQueue -= countToSend;

  try {
    const res = await apiCall("click", { username: activeUser, count: countToSend.toString() });

    if (res.error === "BANNED") {
      document.getElementById("banOverlay").classList.add("active");
    } else if (res.score) {
      // Confirmed server score + whatever clicks you made while request was in transit
      const verifiedTotal = BigInt(res.score) + clickQueue;
      document.getElementById("counter").innerText = verifiedTotal.toString();

      clearTimeout(leaderboardTimer);
      leaderboardTimer = setTimeout(() => {
        loadLeaderboard();
      }, 1000);
    } else if (res.error) {
      // Refund clicks on network error so they never disappear
      clickQueue += countToSend;
      notify(res.error, "error");
    }
  } catch (e) {
    clickQueue += countToSend;
  } finally {
    isSending = false;
    // Immediately send remaining clicks if you clicked while request was traveling
    if (clickQueue > 0n) {
      processClickQueue();
    }
  }
}

  async function resendCode() {
    const btn = document.getElementById("resendBtn");
    btn.disabled = true;
    btn.innerText = "⏳ Resending...";

    const res = await apiCall("resend", { identifier: pendingIdentifier });
    if (res.error) {
      btn.disabled = false;
      btn.innerText = "🔄 Resend Code";
      return notify(res.error, "error");
    }

    notify("Fresh verification code sent to your email!", "success");

    let cd = 45;
    const timer = setInterval(() => {
      btn.innerText = `Wait ${cd}s`;
      cd--;
      if (cd < 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.innerText = "🔄 Resend Code";
      }
    }, 1000);
  }

  async function loadLeaderboard() {
    const users = await apiCall("users", null, "GET");
    if (!Array.isArray(users)) return;

    const list = document.getElementById("rankingList");
    list.innerHTML = "";
    users.forEach(u => {
      const li = document.createElement("li");
      li.innerText = `${u.flag} ${u.name}: ${u.score}`;
      list.appendChild(li);
    });
  }

  const warnings = [
    { title: "⚠️ Warning (1/3)", desc: "Reset your score to zero?", btn: "Continue" },
    { title: "🚨 Warning (2/3)", desc: "All clicks will be erased permanently.", btn: "I Understand" },
    { title: "🛑 Final Warning (3/3)", desc: "Last chance! This cannot be undone.", btn: "Reset to 0" }
  ];

  function openResetModal() { 
    warningStep = 0; 
    showStep(); 
    document.getElementById("modalOverlay").classList.add("active"); 
  }
  
  function closeResetModal() { 
    document.getElementById("modalOverlay").classList.remove("active"); 
  }

  function showStep() {
    document.getElementById("modalTitle").innerText = warnings[warningStep].title;
    document.getElementById("modalDesc").innerText = warnings[warningStep].desc;
    document.getElementById("modalConfirmBtn").innerText = warnings[warningStep].btn;
  }

  async function nextWarning() {
    warningStep++;
    if (warningStep < warnings.length) {
      showStep();
    } else {
      closeResetModal();
      if (isGuest) {
        guestCount = 0n; 
        document.getElementById("counter").innerText = "0";
      } else {
        document.getElementById("counter").innerText = "0";
        await apiCall("reset", { username: activeUser });
        loadLeaderboard(); 
        notify("Score reset to 0", "info");
      }
    }
  }

  function logout() { 
    location.reload(); 
  }
</script>

</body>
</html>
